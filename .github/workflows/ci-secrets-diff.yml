name: CI - Secrets Diff Scan (minimal)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      API_URL: https://api.github.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Collect changed files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -r '.number // .pull_request.number' "$GITHUB_EVENT_PATH")
          curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            | jq -r '.[].filename' > changed_files.txt
          # filter textual targets only
          grep -E '^(README\.md|docs/|\.cursor/rules/)' changed_files.txt || true

      - name: Fetch contents and scan patterns
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(jq -r '.number // .pull_request.number' "$GITHUB_EVENT_PATH")
          # Patterns (minimal)
          regex='(ghp_[0-9A-Za-z]{36,}|sk-[A-Za-z0-9]{20,}|ntn_[0-9A-Za-z]{40,}|secret_[0-9A-Za-z]{40,}|Bearer\s+[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+|OPENAI_API_KEY|ANTHROPIC_API_KEY|OPENROUTER_API_KEY|AZURE_OPENAI_API_KEY)'
          status=0
          while read -r path; do
            case "$path" in
              README.md|docs/*|.cursor/rules/*) ;;
              *) continue;;
            esac
            # Get raw file content for the PR head
            raw_url=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/contents/$path?ref=${{ github.event.pull_request.head.sha }}" | jq -r '.download_url // empty')
            [ -z "$raw_url" ] && continue
            content=$(curl -sSL "$raw_url" || true)
            if echo "$content" | grep -Pq "$regex"; then
              echo "Secret-like pattern detected in: $path"
              status=1
            fi
          done < changed_files.txt
          if [ $status -ne 0 ]; then
            echo "Failing due to detected secret-like pattern(s)." >&2
            exit 1
          fi
          echo "No secret-like patterns found."


